name: Taurino Desktop Wheels

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: taurino-wheels-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UV_NO_PROGRESS: '1'
  PYTHONUNBUFFERED: '1'
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: '3.13'
  MATURIN_SPEC: 'maturin>=1.14,<2'

jobs:
  validate:
    name: '01 / Validate source'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Verify lockfile and metadata
        run: |
          uv lock --check
          uv run --no-project --python 3.13 python - <<'PY'
          import pathlib
          import tomllib
          root = pathlib.Path('.')
          project = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          assert project['project']['name'] == 'taurino'
          assert project['tool']['maturin']['module-name'] == 'taurino.runtime.core'
          assert (root / 'Cargo.lock').is_file()
          print('Metadata verified')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all -- --check

  native:
    name: '02 / ${{ matrix.name }}'
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-gnu-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, kind: linux}
          - {name: linux-gnu-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, kind: linux}
          - {name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc, kind: windows}
          - {name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, kind: windows}
          - {name: macos-intel, os: macos-15-intel, target: x86_64-apple-darwin, kind: macos}
          - {name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, kind: macos}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install GTK and WebKitGTK
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Compile wheel
        env:
          TARGET: ${{ matrix.target }}
          KIND: ${{ matrix.kind }}
        run: |
          mkdir -p dist
          args=(--release --locked --target "$TARGET" --out dist --interpreter "$(uv python find "$PYTHON_VERSION")")
          # GTK/WebKitGTK is dynamically linked. A native linux tag is honest;
          # do NOT falsely advertise manylinux portability.
          if [[ "$KIND" == linux ]]; then
            args+=(--compatibility linux)
          fi
          uvx --from "$MATURIN_SPEC" maturin build "${args[@]}"
      - name: Validate wheel structure and tags
        env:
          TARGET: ${{ matrix.target }}
          KIND: ${{ matrix.kind }}
        run: |
          uv run --no-project --python "$PYTHON_VERSION" python .github/scripts/verify_wheels.py \
            --directory dist --target "$TARGET" --kind "$KIND" --count 1
      - name: Install wheel in fresh environment
        run: |
          uv venv .wheel-test --python "$PYTHON_VERSION"
          uv pip install --python .wheel-test dist/*.whl
          # Run from outside the checkout, so a local source tree cannot mask a broken wheel.
          mkdir -p .wheel-smoke
          cd .wheel-smoke
          uv run --no-project --python ../.wheel-test python -c \
            "import taurino.runtime.core; print('Native extension imported')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  musl:
    name: '03 / ${{ matrix.name }}'
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-musl-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-musl}
          - {name: linux-musl-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build inside native-architecture Alpine
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # JavaScript GitHub Actions run on Ubuntu; only compilation uses Alpine.
          docker run --rm -i \
            -v "$PWD:/work" -w /work \
            -e TARGET -e UV_NO_PROGRESS=1 -e CARGO_TERM_COLOR=always \
            -e CARGO_HOME=/tmp/cargo -e RUSTUP_HOME=/tmp/rustup \
            alpine:3.22 sh -eu <<'ALPINE'
          apk add --no-cache \
            bash curl ca-certificates git build-base pkgconf \
            python3 py3-pip openssl-dev gtk+3.0-dev \
            webkit2gtk-4.1-dev libayatana-appindicator-dev \
            librsvg-dev xdotool-dev patchelf
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          export PATH="/tmp/cargo/bin:$PATH"
          rustup target add "$TARGET"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p dist
          # Repair external shared-library dependencies when possible.
          # A successful repair does not guarantee WebKitGTK runtime portability.
          uvx --from 'maturin>=1.14,<2' maturin build \
            --release \
            --locked \
            --target "$TARGET" \
            --compatibility musllinux_1_2 \
            --auditwheel repair \
            --out dist \
            --interpreter /usr/bin/python3
          python3 .github/scripts/verify_wheels.py \
            --directory dist --target "$TARGET" --kind musl --count 1
          uv venv .wheel-test --python /usr/bin/python3
          uv pip install --python .wheel-test/bin/python dist/*.whl
          mkdir -p .wheel-smoke
          cd .wheel-smoke
          ../.wheel-test/bin/python -c \
            "import taurino.runtime.core; print('musllinux native extension imported')"
          ALPINE
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  collect:
    name: '04 / Validate and collect 8 wheels'
    needs: [native, musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: incoming
          merge-multiple: false
      - name: Verify all targets and create SHA256 manifest
        run: |
          python .github/scripts/verify_wheels.py \
            --directory incoming --count 8 --all-targets --copy-to dist \
            --checksum-file dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taurino-all-wheels
          path: dist/
          if-no-files-found: error
          retention-days: 30
