

# SPDX-License-Identifier: MIT OR Apache-2.0

# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "taurino"
dynamic = ["version"]
authors = [
    { name = "AriBermeki", email = "ari.bermeki.de@gmail.com" }
]

description = "An asynchronous, cross-platform desktop GUI framework for Python, powered by Rust, Tao, and Wry."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "MIT OR Apache-2.0"
license-files = [
    "LICENSE-MIT",
    "LICENSE-APACHE-2.0",
]
keywords = [
    "asyncio",
    "desktop",
    "gui",
    "ipc",
    "multiprocessing",
    "pyo3",
    "rust",
    "tao",
    "tokio",
    "webview",
    "wry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "ipckit>=0.1.12",
    "msgpack>=1.1,<2",
    "ormsgpack>=1.11.0",
    "pydantic>=2.11,<3",
    "taunicorn>=0.1.9,<0.2",
]

# =============================================================================
# Project URLs
# =============================================================================

[project.urls]
Homepage = "https://github.com/taurino-foundation/taurino"
Repository = "https://github.com/taurino-foundation/taurino"
Issues = "https://github.com/taurino-foundation/taurino/issues"

# =============================================================================
# Optional Dependencies - Application Builders
# =============================================================================

[project.optional-dependencies]
nuitka = [
    "nuitka",
    "ordered-set",
    "zstandard",
]
all-builders = [
    "nuitka",
    "ordered-set",
    "zstandard",
]


# =============================================================================
# PyInstaller Hook Registration
# =============================================================================

[project.entry-points.pyinstaller40]
hook-dirs = "taurino._pyinstaller:get_hook_dirs"

# =============================================================================
# Development Dependencies - PEP 735
# =============================================================================

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

lint = [
    "ruff>=0.17.0,<1",
]

test = [
    "pytest>=8.4,<9; python_version < '3.10'",
    "pytest>=9.1.1,<10; python_version >= '3.10'",

    "pytest-asyncio>=1.2,<1.3; python_version < '3.10'",
    "pytest-asyncio>=1.4,<2; python_version >= '3.10'",
]

packaging = [
    "pyinstaller>=6,<7",
    "nuitka",
    "ordered-set",
    "zstandard",
]
# =============================================================================
# Maturin / PyO3
# =============================================================================

[tool.maturin]
manifest-path = "crates/taurino/Cargo.toml"
bindings = "pyo3"
module-name = "taurino.runtime.core"
strip = true

# =============================================================================
# Ruff - Global Settings
# =============================================================================

[tool.ruff]
target-version = "py39"
line-length = 120
indent-width = 4
preview = false
extend-exclude = [
    ".venv",
    "target",
    "dist",
    "build",
]

# =============================================================================
# Ruff - Linter
# =============================================================================

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "BLE",
    "UP",
]
extend-select = ["E501"]
unfixable = ["B", "BLE"]

# =============================================================================
# Ruff - Import Sorting
# =============================================================================

[tool.ruff.lint.isort]
known-first-party = ["taurino"]
combine-as-imports = true
force-sort-within-sections = false

# =============================================================================
# Ruff - Formatter
# =============================================================================

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

# =============================================================================
# Pytest / Pytest AsyncIO
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["./tests"]
# Include runtime.py and any other *.py file, not only test_*.py.
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

